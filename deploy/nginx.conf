server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/md2site;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        text/markdown md;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        application/zip zip;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|md)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
